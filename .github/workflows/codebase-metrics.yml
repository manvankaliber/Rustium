name: Codebase metrics

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: codebase-metrics-main
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v6

      - name: Refresh the root dashboard data
        run: python3 .github/scripts/codebase_metrics.py

      - name: Commit updated dashboard files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html metrics.json
          if git diff --cached --quiet; then
            echo "Dashboard is already up to date."
          else
            git commit -m "Refresh codebase metrics [skip ci]"
            git push origin HEAD:main
          fi
