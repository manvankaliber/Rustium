name: Codebase metrics

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out main
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Generate codebase metrics
        run: python3 .github/scripts/codebase_metrics.py _site

      - name: Upload the dashboard
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Publish the dashboard
        id: deployment
        uses: actions/deploy-pages@v4
